<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The site mark (components/Logo.jsx) on a dark tile, so it reads on
       light and dark browser chrome alike. Hex values mirror the tokens in
       styles/globals.css; a favicon cannot read CSS variables. -->
  <defs>
    <linearGradient id="g" x1="14" y1="10" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="30" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0A0A0B"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#2E2E34" stroke-width="1.5"/>
  <g transform="translate(32 32) scale(0.8) translate(-32 -32)">
    <path d="M32 6 54.5 19v26L32 58 9.5 45V19Z" fill="none" stroke="url(#g)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M22 19.5v25M42 19.5v25" fill="none" stroke="#FAFAFA" stroke-width="6" stroke-linecap="round"/>
    <path d="M22 32h20" fill="none" stroke="url(#g)" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="6.5" fill="#22D3EE"/>
  </g>
</svg>
